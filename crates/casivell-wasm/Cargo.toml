[package]
name = "casivell-wasm"
version = "0.1.0"
description = "A dependency-free C ABI over the Casivell engine, for the browser."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
casivell-core = { path = "../casivell-core" }
casivell-lawdata = { path = "../casivell-lawdata" }
casivell-payroll = { path = "../casivell-payroll" }
casivell-projection = { path = "../casivell-projection" }
casivell-sim = { path = "../casivell-sim" }
casivell-social = { path = "../casivell-social" }

# This crate cannot inherit the workspace lints, because they `forbid(unsafe_code)` and a
# `cdylib` export is spelled `#[unsafe(no_mangle)]` in Rust 2024. `forbid` cannot be relaxed
# even by an `expect` at the site, so the rule is restated here as `deny` — which still fails
# the build on an actual `unsafe` block, and leaves the export attributes as the single
# documented exception. Every other workspace lint is repeated verbatim rather than dropped.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# R7: every fallible operation is handled explicitly. No silent unwinding.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# R3 / R5: arithmetic that can wrap or truncate must be spelled out.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_arithmetic = "deny"

# R4: bounded complexity.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Two `pedantic` lints are wrong for this codebase and are relaxed deliberately
# rather than suppressed at each site.
#
# `many_single_char_names`: in the rounding and narrowing helpers, `n`, `d`, `q`
# and `r` are numerator, denominator, quotient and remainder. Those are the names
# the mathematics uses, and `numerator`/`denominator` would make a three-line
# division proof harder to check against the algebra it implements, not easier.
many_single_char_names = "allow"
# `similar_names`: the domain is full of genuine near-homographs that must not be
# renamed for the linter's benefit — `employee`/`employer` above all, and the
# statutory pairs `Freibetrag`/`Freigrenze` and `Beitragssatz`/`Beitragssatzpunkt`.
# Renaming either half to satisfy the lint would make the code disagree with the
# statute it transcribes.
similar_names = "allow"
