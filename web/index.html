<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casivell — Brutto-Netto</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { opacity: .7; margin: 0 0 2rem; font-size: .9rem; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1rem; }
  label { display: grid; gap: .25rem; font-size: .85rem; }
  input, select { font: inherit; padding: .4rem .5rem; border: 1px solid var(--line); border-radius: .3rem; background: transparent; color: inherit; }
  .full { grid-column: 1 / -1; }
  table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
  td { padding: .35rem 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 600; border-bottom: 2px solid currentColor; }
  tr.sub td { opacity: .65; font-size: .85rem; padding-left: 1.5rem; }
  tr.why { cursor: pointer; }
  tr.why td:first-child::after { content: " ?"; opacity: .45; font-size: .8em; }
  tr.why:hover td:first-child { text-decoration: underline dotted; }
  .explain { margin: 0; padding: .75rem 1rem; background: color-mix(in srgb, currentColor 6%, transparent);
             border-left: 3px solid currentColor; font-size: .85rem; }
  .explain dt { font-weight: 600; margin-top: .5rem; }
  .explain dd { margin: 0 0 0 0; }
  .explain code { font-size: .95em; opacity: .75; }
  .chain { display: grid; grid-template-columns: 1fr auto; gap: .1rem .75rem;
           font-variant-numeric: tabular-nums; margin: .5rem 0; }
  .chain .rule { grid-column: 1 / -1; border-top: 1px solid var(--line); }
  .error { color: #b00; margin-top: 1.5rem; }
  nav { display: flex; gap: .25rem; margin-bottom: 1.5rem; }
  nav button { font: inherit; padding: .4rem .9rem; border: 1px solid var(--line);
               background: transparent; color: inherit; border-radius: .3rem; cursor: pointer; }
  nav button[aria-current="true"] { background: currentColor; color: Canvas; }
  .lede { margin: 1.5rem 0 0; padding: .75rem 1rem; border-left: 3px solid currentColor;
          background: color-mix(in srgb, currentColor 6%, transparent); font-size: .9rem; }
  th { text-align: left; font-weight: 600; font-size: .85rem; padding: .35rem 0;
       border-bottom: 1px solid var(--line); }
  th:not(:first-child), td.num { text-align: right; font-variant-numeric: tabular-nums; }
  footer { margin-top: 2.5rem; font-size: .8rem; opacity: .7; }
  footer p { margin: .4rem 0; }
</style>
</head>
<body>
<h1>Casivell</h1>
<p class="sub">Brutto zu Netto, gerechnet nach dem BMF-Programmablaufplan. Nichts verlässt dieses Gerät.</p>

<nav>
  <button type="button" data-form="payslip" aria-current="true">Brutto-Netto</button>
  <button type="button" data-form="classes">Steuerklassen</button>
</nav>

<form id="f">
  <label class="full" id="grossRow">Bruttolohn (€ / Monat)
    <input type="number" id="gross" value="5500" min="0" step="1">
  </label>
  <label id="partnerRow" hidden>Bruttolohn Partner (€ / Monat)
    <input type="number" id="partner" value="1800" min="0" step="1">
  </label>
  <label id="classRow">Steuerklasse
    <select id="class">
      <option value="1" selected>I</option><option value="2">II</option>
      <option value="3">III</option><option value="4">IV</option>
      <option value="5">V</option><option value="6">VI</option>
    </select>
  </label>
  <label>Bundesland <select id="land"></select></label>
  <label>Jahr <select id="year"></select></label>
  <label>Alter <input type="number" id="age" value="30" min="0" max="120"></label>
  <label>Kinder <input type="number" id="children" value="0" min="0" max="20"></label>
  <label>Zusatzbeitrag (%) <input type="number" id="kvz" value="2.9" min="0" max="10" step="0.1"></label>
  <label>Kirchensteuer
    <select id="church"><option value="0" selected>nein</option><option value="1">ja</option></select>
  </label>
</form>

<div id="out"></div>

<footer>
  <p><strong>Keine Steuerberatung</strong> (§§ 1–4 StBerG). Vorläufige Werte; der
     Jahresausgleich rechnet ab.</p>
  <p id="basis"></p>
  <p>Was dieser Rechner <em>nicht</em> kann, steht in <code>docs/LIMITATIONS.md</code>.</p>
</footer>

<script type="module">
// The sixteen states, in `Bundesland::ALL` order — the index the ABI expects.
const LAENDER = ["Baden-Württemberg","Bayern","Berlin","Brandenburg","Bremen","Hamburg",
  "Hessen","Mecklenburg-Vorpommern","Niedersachsen","Nordrhein-Westfalen","Rheinland-Pfalz",
  "Saarland","Sachsen","Sachsen-Anhalt","Schleswig-Holstein","Thüringen"];

const ARR = { FOUR_FOUR:0, THREE_FIVE:1, FOUR_FACTOR:2 };
const CF = { HIGHER:0, LOWER:1, WITHHOLDING:2, NET:3, SETTLEMENT:4 };

const FIELD = { GROSS:0, INCOME_TAX:1, SOLIDARITY:2, CHURCH_TAX:3, CONTRIBUTIONS:4,
                NET:5, PENSION:6, HEALTH:7, CARE:8, UNEMPLOYMENT:9,
                // The § 39b working, under the Programmablaufplan's own variable names.
                ANNUAL_GROSS:10, TABLE_ALLOWANCES:11, VORSORGEPAUSCHALE:12,
                TAXABLE_ANNUAL:13, ANNUAL_INCOME_TAX:14, SURCHARGE_BASE:15 };

// Where each figure comes from. The citations are structural — a paragraph number, not an
// amount — so they do not go stale when a rate changes; the amounts all come from the engine.
const WHY = {
  [FIELD.INCOME_TAX]: {
    law: "§ 39b EStG · BMF-Programmablaufplan",
    text: "Der PAP rechnet den Monatslohn aufs Jahr hoch, zieht die Freibeträge und die " +
          "Vorsorgepauschale ab, wendet den Tarif des § 32a auf den Rest an und teilt " +
          "wieder durch zwölf. Die Zwischenschritte stehen unten.",
    chain: true,
  },
  [FIELD.SOLIDARITY]: {
    law: "SolzG 1995 · § 3, § 4",
    text: "5,5 % der Lohnsteuer, aber erst oberhalb der Freigrenze und dann zunächst " +
          "abgemildert. Unterhalb bleibt er null — deshalb steht hier bei den meisten " +
          "Gehältern 0,00 €.",
  },
  [FIELD.CHURCH_TAX]: {
    law: "Kirchensteuergesetze der Länder · § 51a EStG",
    text: "8 % in Bayern und Baden-Württemberg, 9 % sonst — bemessen auf die Lohnsteuer, " +
          "die mit Kinderfreibeträgen gerechnet wird (§ 51a Abs. 2). Die Kappung, die die " +
          "meisten Landeskirchen anwenden, ist nicht abgebildet.",
  },
  [FIELD.PENSION]: { law: "§ 158 SGB VI", text: "18,6 % geteilt durch zwei, bis zur Beitragsbemessungsgrenze." },
  [FIELD.HEALTH]: { law: "§ 241 SGB V", text: "14,6 % geteilt durch zwei, plus die Hälfte des kassenindividuellen Zusatzbeitrags." },
  [FIELD.CARE]: { law: "§ 55 SGB XI", text: "3,6 % geteilt durch zwei, mit Zuschlag für Kinderlose ab 23 und Abschlag je Kind ab dem zweiten. In Sachsen trägt der Arbeitnehmer einen Punkt mehr." },
  [FIELD.UNEMPLOYMENT]: { law: "§ 341 SGB III", text: "2,6 % geteilt durch zwei, bis zur selben Grenze wie die Rentenversicherung." },
  [FIELD.CONTRIBUTIONS]: { law: "SGB III / V / VI / XI", text: "Die Summe der vier Zweige. Jeder ist oben einzeln aufgeführt." },
  [FIELD.NET]: { law: "—", text: "Brutto abzüglich aller Posten darüber. Vorläufig: der Jahresausgleich rechnet ab." },
};

const ERRORS = {
  "-1": "Für dieses Jahr liegen keine Daten vor.",
  "-2": "Unbekannte Steuerklasse.",
  "-3": "Unbekanntes Bundesland.",
  "-4": "Eine Eingabe liegt außerhalb des zulässigen Bereichs. Kinder setzen die Elterneigenschaft voraus.",
  "-5": "Die Rechnung hat den darstellbaren Bereich verlassen.",
};

// No bindings crate: the module is instantiated directly and its exports are plain numbers.
const { instance } = await WebAssembly.instantiateStreaming(fetch("casivell_wasm.wasm"), {});
const wasm = instance.exports;

const euro = cents => (cents / 100).toLocaleString("de-DE",
  { style: "currency", currency: "EUR" });

// Populate the pickers from the engine rather than from a hard-coded list, so the page
// cannot offer a year the calculation refuses.
const packed = Number(wasm.casivell_enacted_years());
const [first, last] = [Math.floor(packed / 10000), packed % 10000];
const yearSelect = document.getElementById("year");
for (let y = last; y >= first; y--) yearSelect.add(new Option(y, y));
const landSelect = document.getElementById("land");
LAENDER.forEach((name, i) => landSelect.add(new Option(name, i)));
landSelect.value = "9";
// The Datenstand: the digest of the statutory data these figures rest on. Two people quoting
// the same one are looking at the same law rather than assuming they are.
const digest = BigInt.asUintN(64, wasm.casivell_fingerprint(last)).toString(16).padStart(16, "0");
document.getElementById("basis").textContent =
  `Rechtsstand ${first === last ? first : `${first}–${last}`}, gesetzlich in Kraft. Datenstand ${digest}.`;

const value = id => Number(document.getElementById(id).value);

function render() {
  const children = value("children");
  // The two i64 parameters cross as BigInt; every i32 stays a plain Number.
  const code = wasm.casivell_payslip(
    BigInt(Math.round(value("gross") * 100)), 0, value("year"), value("class"),
    value("land"), value("age"), children,
    children > 0 ? 1 : 0,               // children imply Elterneigenschaft
    value("church"), BigInt(Math.round(value("kvz") * 10000)));

  const out = document.getElementById("out");
  if (code !== 0) {
    out.innerHTML = `<p class="error">${ERRORS[String(code)] ?? "Unbekannter Fehler."}</p>`;
    return;
  }

  const get = f => Number(wasm.casivell_result(f));
  const row = (label, field, cls = "") => {
    const why = WHY[field] ? ` why" data-field="${field}` : "";
    return `<tr class="${cls}${why}"><td>${label}</td><td>${euro(get(field))}</td></tr>`;
  };

  // The § 39b chain, shown when the Lohnsteuer line is opened. Every number is the engine's;
  // nothing here is recomputed in JavaScript, because a second implementation would be a
  // second thing to be wrong.
  const chain = () => `<div class="chain">
    <span>Jahresarbeitslohn <code>ZRE4</code></span><span>${euro(get(FIELD.ANNUAL_GROSS))}</span>
    <span>− Tabellenfreibeträge <code>ZTABFB</code></span><span>−${euro(get(FIELD.TABLE_ALLOWANCES))}</span>
    <span>− Vorsorgepauschale <code>VSP</code></span><span>−${euro(get(FIELD.VORSORGEPAUSCHALE))}</span>
    <span class="rule">= zu versteuernder Betrag <code>ZVE</code></span><span>${euro(get(FIELD.TAXABLE_ANNUAL))}</span>
    <span>Jahreslohnsteuer <code>LSTJAHR</code></span><span>${euro(get(FIELD.ANNUAL_INCOME_TAX))}</span>
    <span class="rule">÷ 12 = Lohnsteuer im Monat</span><span>${euro(get(FIELD.INCOME_TAX))}</span>
  </div>`;

  out.innerHTML = `<table>
    ${row("Bruttolohn", FIELD.GROSS)}
    ${row("Lohnsteuer", FIELD.INCOME_TAX)}
    ${row("Solidaritätszuschlag", FIELD.SOLIDARITY)}
    ${get(FIELD.CHURCH_TAX) ? row("Kirchensteuer", FIELD.CHURCH_TAX) : ""}
    ${row("Sozialabgaben", FIELD.CONTRIBUTIONS)}
    ${row("Rentenversicherung", FIELD.PENSION, "sub")}
    ${row("Krankenversicherung", FIELD.HEALTH, "sub")}
    ${row("Pflegeversicherung", FIELD.CARE, "sub")}
    ${row("Arbeitslosenversicherung", FIELD.UNEMPLOYMENT, "sub")}
    ${row("Nettolohn", FIELD.NET, "total")}
  </table>
  <p class="sub" style="margin-top:.75rem">Auf eine Zeile klicken, um zu sehen, welche Regel sie erzeugt hat.</p>
  <div id="why"></div>`;

  // Explainability: every figure names the provision that produced it. Delegated from the
  // table so it survives each re-render.
  out.querySelector("table").addEventListener("click", event => {
    const tr = event.target.closest("tr.why");
    const panel = document.getElementById("why");
    if (!tr) return;
    const field = Number(tr.dataset.field);
    if (panel.dataset.open === String(field)) { panel.innerHTML = ""; panel.dataset.open = ""; return; }
    const why = WHY[field];
    panel.dataset.open = String(field);
    panel.innerHTML = `<dl class="explain">
      <dt>${tr.cells[0].textContent.trim()} — ${why.law}</dt>
      <dd>${why.text}</dd>
      ${why.chain ? chain() : ""}
    </dl>`;
  });
}

// -------------------------------------------------------------------------
// Steuerklassen: the comparison whose whole point is that the total does not move
// -------------------------------------------------------------------------

function renderClasses() {
  const children = value("children");
  const code = wasm.casivell_compare_classes(
    BigInt(Math.round(value("gross") * 100)), BigInt(Math.round(value("partner") * 100)),
    value("year"), value("land"), value("age"), children,
    children > 0 ? 1 : 0, value("church"), BigInt(Math.round(value("kvz") * 10000)));

  const out = document.getElementById("out");
  if (code !== 0) {
    out.innerHTML = `<p class="error">${ERRORS[String(code)] ?? "Unbekannter Fehler."}</p>`;
    return;
  }

  const g = (arr, f) => Number(wasm.casivell_class_result(arr, f));
  const liability = Number(wasm.casivell_class_liability());
  const factor = Number(wasm.casivell_class_factor());

  const settlement = cents => cents < 0
    ? `${euro(-cents)} nachzahlen`
    : `${euro(cents)} zurück`;

  const row = (label, arr) => `<tr>
      <td>${label}</td>
      <td class="num">${euro(g(arr, CF.HIGHER))}</td>
      <td class="num">${euro(g(arr, CF.LOWER))}</td>
      <td class="num">${euro(g(arr, CF.NET))}</td>
      <td class="num">${settlement(g(arr, CF.SETTLEMENT))}</td>
    </tr>`;

  out.innerHTML = `<p class="lede">Die Jahres-Einkommensteuer beträgt
      <strong>${euro(liability)}</strong> — bei allen drei Varianten. Die Steuerklasse
      entscheidet, <em>wann</em> gezahlt wird und von wem, nicht wie viel.</p>
    <table>
      <tr><th>Variante</th><th>höher</th><th>niedriger</th><th>Netto ges.</th><th>Veranlagung</th></tr>
      ${row("IV / IV", ARR.FOUR_FOUR)}
      ${row("III / V", ARR.THREE_FIVE)}
      ${row(factor ? `IV + Faktor 0,${String(factor).padStart(3, "0")}` : "IV + Faktor",
            ARR.FOUR_FACTOR)}
    </table>
    ${factor ? "" : `<p class="sub">Der Faktor ist nur unter 1 zulässig (§ 39f Abs. 1).
       Bei etwa gleichen Gehältern zieht Klasse IV bereits richtig ab, es gibt nichts zu
       korrigieren.</p>`}
    <dl class="explain">
      <dt>Warum die Summe gleich bleibt</dt>
      <dd>§ 32a Abs. 5 EStG bestimmt die Jahressteuer eines Ehepaares aus dem gemeinsamen
      Einkommen. Keine Kombination von Klassen ändert daran etwas — der Jahresausgleich
      holt die Differenz in beide Richtungen zurück.</dd>
      <dt>Wo die Wahl trotzdem zählt</dt>
      <dd>Lohnersatzleistungen werden aus dem <em>Netto</em> berechnet: Elterngeld,
      Arbeitslosen- und Krankengeld fallen in Klasse V spürbar niedriger aus als in
      Klasse III — bei gleicher Jahressteuer. Vor einer Geburt ist die Klassenwahl
      deshalb eine echte Entscheidung.</dd>
    </dl>`;
}

// -------------------------------------------------------------------------

let currentForm = "payslip";

function show() {
  const classes = currentForm === "classes";
  document.getElementById("partnerRow").hidden = !classes;
  // The tax class is what the comparison varies, so offering it as an input would be
  // incoherent rather than merely redundant.
  document.getElementById("classRow").hidden = classes;
  (classes ? renderClasses : render)();
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    currentForm = button.dataset.form;
    document.querySelectorAll("nav button").forEach(other =>
      other.setAttribute("aria-current", String(other === button)));
    show();
  });
});

document.getElementById("f").addEventListener("input", show);
show();
</script>
</body>
</html>
